# Render Blueprint for the standalone wayfinding app.
#
# Two things this pins down, both of which fail silently otherwise:
#   * --include=dev — Render sets NODE_ENV=production, and npm then skips
#     devDependencies, so `vite` would be missing at build time.
#   * the SPA rewrite — every path must serve index.html, or a refresh on any
#     route 404s.
services:
  - type: web
    runtime: static
    name: navme-3d-wayfinding
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Vite inlines these at BUILD time — they must be set before the first
      # build or the bundle ships without them. Values are not stored here.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
